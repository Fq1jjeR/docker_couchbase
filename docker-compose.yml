services:
  couchbase:
    build: .
    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8094:8094"
      - "8095:8095"
      - "8096:8096"
      - "11210:11210"
    volumes:
      - couchbase_data:/opt/couchbase/var
    environment:
      - COUCHBASE_ADMINISTRATOR_USERNAME=admin
      - COUCHBASE_ADMINISTRATOR_PASSWORD=password123
      - COUCHBASE_BUCKET=demo
      - COUCHBASE_BUCKET_RAMSIZE=256

volumes:
  couchbase_data: